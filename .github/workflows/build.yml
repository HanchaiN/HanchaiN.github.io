name: Deploy to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: "true"
      - name: Detech submodule hash
        id: detect-submodule-hash
        run: |
          echo "smu=$(git submodule status | grep smu)" >> ${GITHUB_OUTPUT}
          echo "saait=$(git submodule status | grep saait)" >> ${GITHUB_OUTPUT}
      - uses: actions/cache@v6
        id: smu-cache
        with:
          path: |
            ${{ github.workspace }}/external/smu/smu
            ${{ github.workspace }}/external/smu/*.o
          key: ${{ runner.os }}-smu-${{ steps.detect-submodule-hash.outputs.smu }}
          restore-keys: |
            ${{ runner.os }}-smu-
      - name: Build smu
        if: steps.smu-cache.outputs.cache-hit != 'true'
        run: |
          make -C external/smu
      - uses: actions/cache@v6
        id: saait-cache
        with:
          path: |
            ${{ github.workspace }}/external/saait/saait
            ${{ github.workspace }}/external/saait/*.o
          key: ${{ runner.os }}-saait-${{ steps.detect-submodule-hash.outputs.saait }}
          restore-keys: |
            ${{ runner.os }}-saait-
      - name: Build saait
        if: steps.saait-cache.outputs.cache-hit != 'true'
        run: |
          make -C external/saait
      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package-lock.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi
      - name: Enable Corepack before setting up Node
        run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Detect package manager cache
        id: detect-npm-cache
        if: steps.detect-package-manager.outputs.manager == 'npm'
        run: |
          echo "cachedir=$(npm config get cache)" >> ${GITHUB_OUTPUT}
      - uses: actions/cache@v6
        id: npm-cache
        if: steps.detect-package-manager.outputs.manager == 'npm'
        with:
          path: ${{ steps.detect-npm-cache.outputs.dir }}
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Detect package manager cache
        id: detect-yarn-cache
        if: steps.detect-package-manager.outputs.manager == 'yarn'
        run: |
          echo "cachedir=$(yarn config get cacheFolder)" >> ${GITHUB_OUTPUT}
      - uses: actions/cache@v6
        id: yarn-cache
        if: steps.detect-package-manager.outputs.manager == 'yarn'
        with:
          path: ${{ steps.detect-yarn-cache.outputs.cachedir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: Install dependencies
        run: |
          ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}
      - name: Build
        run: |
          NODE_ENV="production" ${{ steps.detect-package-manager.outputs.manager }} run clean
          NODE_ENV="production" ${{ steps.detect-package-manager.outputs.manager }} run build
      - name: Upload artifact
        id: deployment
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
