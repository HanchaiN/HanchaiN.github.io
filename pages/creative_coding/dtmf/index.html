<!doctype html>
<html>
  <head>
    <title>DTMF signaling</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "@/": "/",
          "katex": "https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.mjs",
          "katex/": "https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/",
          "p5": "https://cdn.jsdelivr.net/npm/p5@1.11.10/+esm",
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
          "mathjs": "https://cdn.jsdelivr.net/npm/mathjs@14.7.0/+esm"
        }
      }
    </script>
    <script type="module">
      import execute from "@/creative_coding/dtmf/index.js";

      const root = document.getElementById("demo");
      execute().start(
        root.querySelector("#canvas"),
        root.querySelector("#config"),
      );
    </script>
  </head>
  <body>
    <h1>DTMF signaling</h1>
    <div id="demo">
      <canvas id="canvas" width="500" height="500">
        Canvas not supported.
      </canvas>
    </div>
    <div class="description">
      <h2>Controls</h2>
      <ul>
        <li>
          <span class="input">1234 QWER ASDF ZXCV</span>
          <span class="result">Keypad (full 16 keys)</span>
        </li>
        <li>
          <span class="input">Numpad0-Numpad9</span>
          <span class="result">Keypad (alternative)</span>
        </li>
      </ul>
    </div>
  </body>
</html>
