<!doctype html>
<html>
  <head>
    <title>Dynamical System</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "@/": "/",
          "katex": "https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.mjs",
          "katex/": "https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/",
          "p5": "https://cdn.jsdelivr.net/npm/p5@1.11.10/+esm",
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
          "mathjs": "https://cdn.jsdelivr.net/npm/mathjs@14.7.0/+esm"
        }
      }
    </script>
    <script type="module">
      import execute from "@/creative_coding/dynamical_system/index.js";

      const root = document.getElementById("dynamic-system");
      execute().start(root.querySelector("#canvas"));
    </script>
  </head>
  <body>
    <h1>Dynamical System</h1>
    <div class="preview-container" id="dynamic-system">
      <canvas
        class="border border-primary rounded border-opacity-50"
        id="canvas"
        width="500"
        height="500"
      ></canvas>
    </div>
    <p>
      In physics, a dynamical system is described as a “particle or ensemble of
      particles whose state varies over time and thus obeys differential
      equations involving time derivatives”.
    </p>
  </body>
