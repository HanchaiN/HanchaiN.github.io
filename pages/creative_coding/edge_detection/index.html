<!doctype html>
<html>
  <head>
    <title>Edge Detection</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "@/": "/",
          "katex": "https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.mjs",
          "katex/": "https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/",
          "p5": "https://cdn.jsdelivr.net/npm/p5@1.11.10/+esm",
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
          "mathjs": "https://cdn.jsdelivr.net/npm/mathjs@14.7.0/+esm"
        }
      }
    </script>
    <script type="module">
      import execute from "@/creative_coding/edge_detection/index.js";

      const root = document.getElementById("edge-detection");
      execute().start(
        root.querySelector("#canvas"),
        root.querySelector("#config"),
      );
    </script>
  </head>
  <body>
    <h1>Edge Detection</h1>
    <div class="preview-container" id="edge-detection">
      <canvas
        class="border border-primary rounded border-opacity-50"
        id="canvas"
        width="500"
        height="500"
      ></canvas>
      <form class="data-container" id="config">
        <label for="image">Image:</label
        ><input id="image" type="file" accept="image/*" />
      </form>
    </div>
    <p>
      Edge detection includes a variety of mathematical methods that aim at
      identifying edges, defined as curves in a digital image at which the image
      brightness changes sharply or, more formally, has discontinuities.
    </p>
  </body>
</html>
