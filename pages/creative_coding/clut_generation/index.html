<!doctype html>
<html>
  <head>
    <title>CLUT Generation</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "@/": "/",
          "katex": "https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.mjs",
          "katex/": "https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/",
          "p5": "https://cdn.jsdelivr.net/npm/p5@1.11.10/+esm",
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
          "mathjs": "https://cdn.jsdelivr.net/npm/mathjs@14.7.0/+esm"
        }
      }
    </script>
    <script type="module">
      import execute from "@/creative_coding/clut_generation/index.js";

      const root = document.getElementById("clut-generation");
      execute().start(
        root.querySelector("#canvas"),
        root.querySelector("#config"),
      );
    </script>
  </head>
  <body>
    <h1>CLUT Generation</h1>
    <div class="preview-container" id="clut-generation">
      <canvas
        class="border border-primary rounded border-opacity-50"
        id="canvas"
        width="500"
        height="500"
      ></canvas>
      <form class="data-container" id="config">
        <label for="level">Level:</label
        ><input
          id="level"
          type="number"
          value="1"
          min="1"
          max="16"
          step="1"
        /><label for="algorithm">Algorithm:</label
        ><select id="algorithm">
          <option value="" selected>None</option>
          <option value="nearest">Nearest</option>
          <option value="gaussian">Gaussian radial basis</option>
          <option value="inverse">Inverse distance weighting</option>
          <option value="rbf">Custom RBF</option>
          <option value="map">Custom Mapping</option>
        </select>
        <div id="algorithm-options">
          <div data-select="gaussian">
            <label for="temperature">Temperature:</label
            ><input
              id="temperature"
              type="number"
              value="0.05"
              min="0"
              step="1e-5"
            />
          </div>
          <div data-select="gaussian inverse rbf">
            <label for="count">Color Count:</label
            ><input id="count" type="number" value="3" min="0" step="1" />
          </div>
          <div data-select="rbf">
            <label for="rbf">RBF:</label
            ><input
              id="rbf"
              type="text"
              value="(d) =&gt; Math.exp(-Math.pow(d, 2) / 0.05)"
              placeholder="(distance) =&gt; weight"
            />
          </div>
          <div data-select="nearest gaussian inverse rbf">
            <textarea id="palette-text"></textarea>
            <div id="palette"></div>
          </div>
          <div data-select="map">
            <label for="color-space">Color Space:</label
            ><select id="color-space">
              <option value="srgb">sRGB</option>
              <option value="rgb">RGB</option>
              <option value="xyz">CIE XYZ</option>
              <option value="lms">CIE LMS</option>
              <option value="lab" selected>CIE Lab</option>
              <option value="hcl">CIE HCL</option>
              <option value="oklab">OKLab</option>
              <option value="okhcl">OKHCL</option>
            </select>
          </div>
          <div data-select="map">
            <label for="mapper">Mapper:</label
            ><input
              id="mapper"
              type="text"
              value="([l, a, b]) =&gt; [l, a, b]"
              placeholder="([c1, c2, c3]) =&gt; [c1, c2, c3]"
            />
          </div>
        </div>
        <button id="apply" type="button">Execute</button>
      </form>
    </div>
    <p>
      A 3D LUT is a 3D lattice of output RGB color values that can be indexed by
      sets of input RGB colour values. Each axis of the lattice represents one
      of the three input color components and the input color thus defines a
      point inside the lattice.
    </p>
  </body>
</html>
