<!doctype html>
<html>
  <head>
    <title>Hilbert Curve</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "@/": "/",
          "katex": "https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.mjs",
          "katex/": "https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/",
          "p5": "https://cdn.jsdelivr.net/npm/p5@1.11.10/+esm",
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
          "mathjs": "https://cdn.jsdelivr.net/npm/mathjs@14.7.0/+esm"
        }
      }
    </script>
    <script type="module">
      import execute from "@/creative_coding/hilbert/index.js";

      const root = document.getElementById("hilbert");
      execute().start(root.querySelector("#canvas"));
    </script>
  </head>
  <body>
    <h1>Hilbert Curve</h1>
    <div class="preview-container" id="hilbert">
      <canvas
        class="pixelated border border-primary rounded border-opacity-50"
        id="canvas"
        width="500"
        height="500"
      ></canvas>
    </div>
    <p>
      The Hilbert curve (also known as the Hilbert space-filling curve) is a
      continuous fractal space-filling curve first described by the German
      mathematician David Hilbert in 1891, as a variant of the space-filling
      Peano curves discovered by Giuseppe Peano in 1890.
    </p>
  </body>
</html>
